name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd bridge && chmod +x test/fake-claude.sh test/fake-adb.sh && node --test
      - run: cd control && chmod +x test/fake-adb.sh && node --test
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
        env: { ANDROID_HOME: /usr/local/lib/android/sdk }
      - run: mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/claude-droid.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/claude-droid.apk }
      - run: zip -r out/bridge.zip bridge control/control-mcp.mjs control/setup.sh -x 'bridge/test/*' && zip out/control.zip control/control-mcp.mjs control/setup.sh
      - uses: actions/upload-artifact@v4
        with: { name: bridge, path: out/bridge.zip }
      - uses: actions/upload-artifact@v4
        with: { name: control, path: out/control.zip }
